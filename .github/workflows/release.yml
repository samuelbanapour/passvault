name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
          - os: ubuntu-22.04
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}

      - name: Install Linux GUI build deps
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            libssl-dev \
            libgtk-3-dev \
            libsqlite3-dev

      - name: Build CLI + key-custody server
        run: cargo build --release -p passvault -p passvault-keyserver

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2.0.0" --locked

      - name: Build GUI installer
        run: cargo tauri build
        working-directory: gui

      - name: Stage macOS artifacts
        if: matrix.platform == 'macos'
        run: |
          mkdir -p dist-out
          cp target/release/passvault dist-out/passvault-macos
          cp target/release/passvault-keyserver dist-out/passvault-keyserver-macos
          cp -R target/release/bundle/macos/PassVault.app dist-out/
          ditto -c -k --sequesterRsrc dist-out/PassVault.app dist-out/PassVault-macos.app.zip
          rm -rf dist-out/PassVault.app
          cp target/release/bundle/dmg/*.dmg dist-out/ 2>/dev/null || true

      - name: Stage Windows artifacts
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          mkdir -p dist-out
          cp target/release/passvault.exe dist-out/passvault-windows.exe
          cp target/release/passvault-keyserver.exe dist-out/passvault-keyserver-windows.exe
          cp target/release/bundle/nsis/*.exe dist-out/ 2>/dev/null || true

      - name: Stage Linux artifacts
        if: matrix.platform == 'linux'
        run: |
          mkdir -p dist-out
          cp target/release/passvault dist-out/passvault-linux
          cp target/release/passvault-keyserver dist-out/passvault-keyserver-linux
          cp target/release/bundle/deb/*.deb dist-out/ 2>/dev/null || true
          cp target/release/bundle/appimage/*.AppImage dist-out/ 2>/dev/null || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: dist-out/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*/*
          generate_release_notes: true
